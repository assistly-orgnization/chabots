<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistly embed test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a2a2a; font-family: system-ui, sans-serif; }
      .frame {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .widget {
        width: 100%;
        max-width: 480px;
        height: min(720px, 90vh);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="widget" id="root"></div>
    </div>

    <script type="module">
      // Import React + the widget from the local built bundle.
      // We use esm.sh for React so we don't have to install anything.
      import React from 'https://esm.sh/react@19.2.4';
      import { createRoot } from 'https://esm.sh/react-dom@19.2.4/client';
      import { AssistlyChat } from './packages/embed/dist/index.js';

      const root = createRoot(document.getElementById('root'));
      root.render(
        React.createElement(AssistlyChat, {
          chatbotId: 1,
          origin: 'https://chatbot-xi-rose-68.vercel.app',
          primaryColor: '#b8893a',
        })
      );
    </script>
  </body>
</html>
